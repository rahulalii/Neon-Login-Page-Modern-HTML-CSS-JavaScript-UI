<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devrootx — Modern & Secure Authentication</title>
  <meta name="description" content="A sleek, modern, and secure login and registration portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Main Auth Container -->
  <main class="auth-wrapper">
    <div class="auth-card" id="authCard">
      <!-- Card Glow Effect -->
      <div class="card-glow" id="cardGlow"></div>

      <!-- Brand Header -->
      <header class="brand-header">
        <div class="brand-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366F1"/>
                <stop offset="0.5" stop-color="#8B5CF6"/>
                <stop offset="1" stop-color="#06B6D4"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="brand-name">Devrootx</h1>
        <p class="brand-tagline" id="brandTagline">Welcome back! Please enter your details.</p>
      </header>

      <!-- Tab Switcher -->
      <div class="tab-switcher" role="tablist" aria-label="Authentication modes">
        <div class="tab-glider" id="tabGlider"></div>
        <button type="button" class="tab-btn active" id="loginTab" role="tab" aria-selected="true" aria-controls="loginFormSection">Sign In</button>
        <button type="button" class="tab-btn" id="signupTab" role="tab" aria-selected="false" aria-controls="signupFormSection">Sign Up</button>
      </div>

      <!-- Social Logins -->
      <div class="social-login-group">
        <button type="button" class="social-btn" id="googleLogin" aria-label="Sign in with Google" title="Google">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.5 0 2.8.5 3.9 1.5l2.9-2.9C17 2 14.7 1.2 12 1.2 7.7 1.2 4 3.7 2.3 7.3l3.6 2.8C6.8 7.3 9.2 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.9 14.8c-.3-.8-.4-1.8-.4-2.8s.1-2 .4-2.8L2.3 6.4C1.5 8.1 1 10 1 12s.5 3.9 1.3 5.6l3.6-2.8z"/>
            <path fill="#34A853" d="M12 22.8c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-2.8 0-5.2-2.3-6.1-5.1L2.3 15.8C4 19.4 7.7 22.8 12 22.8z"/>
          </svg>
          <span>Google</span>
        </button>

        <button type="button" class="social-btn" id="githubLogin" aria-label="Sign in with GitHub" title="GitHub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span>GitHub</span>
        </button>

        <button type="button" class="social-btn" id="appleLogin" aria-label="Sign in with Apple" title="Apple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.08 1.73-.95 2.75 1.01.08 2.05-.5 2.68-1.25z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span>or continue with email</span>
      </div>

      <!-- Forms Container -->
      <div class="forms-wrapper">
        <!-- Sign In Form -->
        <section id="loginFormSection" class="form-section active" role="tabpanel" aria-labelledby="loginTab">
          <form id="loginForm" novalidate>
            <div class="input-group">
              <label for="loginEmail">Email Address</label>
              <div class="input-field">
                <span class="field-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
              </div>
              <span class="error-msg" id="loginEmailError"></span>
            </div>

            <div class="input-group">
              <div class="label-row">
                <label for="loginPassword">Password</label>
                <button type="button" class="forgot-link" id="openForgotModal">Forgot password?</button>
              </div>
              <div class="input-field">
                <span class="field-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                  <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-.722-3.25"/>
                    <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
                    <path d="m20 15-1.726-2.05"/>
                    <path d="m4 15 1.726-2.05"/>
                    <path d="m9 18 .722-3.25"/>
                  </svg>
                </button>
              </div>
              <span class="error-msg" id="loginPasswordError"></span>
            </div>

            <div class="options-row">
              <label class="custom-checkbox">
                <input type="checkbox" id="rememberMe">
                <span class="checkbox-mark"></span>
                <span class="checkbox-label">Remember me for 30 days</span>
              </label>
            </div>

            <button type="submit" class="submit-btn" id="loginSubmitBtn">
              <span class="btn-text">Sign In</span>
              <span class="spinner hidden"></span>
            </button>
          </form>
        </section>

        <!-- Sign Up Form -->
        <section id="signupFormSection" class="form-section hidden" role="tabpanel" aria-labelledby="signupTab">
          <form id="signupForm" novalidate>
            <div class="input-group">
              <label for="signupName">Full Name</label>
              <div class="input-field">
                <span class="field-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input type="text" id="signupName" placeholder="Alex Morgan" autocomplete="name" required>
              </div>
              <span class="error-msg" id="signupNameError"></span>
            </div>

            <div class="input-group">
              <label for="signupEmail">Email Address</label>
              <div class="input-field">
                <span class="field-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>
              </div>
              <span class="error-msg" id="signupEmailError"></span>
            </div>

            <div class="input-group">
              <label for="signupPassword">Password</label>
              <div class="input-field">
                <span class="field-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="signupPassword" placeholder="Create a strong password" autocomplete="new-password" required>
                <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Toggle password visibility">
                  <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-.722-3.25"/>
                    <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
                    <path d="m20 15-1.726-2.05"/>
                    <path d="m4 15 1.726-2.05"/>
                    <path d="m9 18 .722-3.25"/>
                  </svg>
                </button>
              </div>
              <!-- Password Strength Meter -->
              <div class="strength-meter-container" id="strengthContainer">
                <div class="strength-bars">
                  <div class="strength-bar" id="bar1"></div>
                  <div class="strength-bar" id="bar2"></div>
                  <div class="strength-bar" id="bar3"></div>
                  <div class="strength-bar" id="bar4"></div>
                </div>
                <span class="strength-text" id="strengthText">Must contain at least 8 characters</span>
              </div>
              <span class="error-msg" id="signupPasswordError"></span>
            </div>

            <div class="options-row">
              <label class="custom-checkbox">
                <input type="checkbox" id="termsAgreement" required>
                <span class="checkbox-mark"></span>
                <span class="checkbox-label">I agree to the <a href="#" class="inline-link">Terms of Service</a> & <a href="#" class="inline-link">Privacy Policy</a></span>
              </label>
            </div>
            <span class="error-msg" id="termsError"></span>

            <button type="submit" class="submit-btn" id="signupSubmitBtn">
              <span class="btn-text">Create Account</span>
              <span class="spinner hidden"></span>
            </button>
          </form>
        </section>
      </div>

      <!-- Footer Info -->
      <footer class="card-footer">
        <p class="security-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          <span>End-to-end encrypted authentication</span>
        </p>
      </footer>
    </div>
  </main>

  <!-- Forgot Password Modal Dialog -->
  <div class="modal-overlay hidden" id="forgotModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button class="modal-close" id="closeForgotModal" aria-label="Close modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h2 class="modal-title" id="modalTitle">Reset your password</h2>
      <p class="modal-desc">Enter the email associated with your account and we will send a password reset link.</p>

      <form id="forgotForm" novalidate>
        <div class="input-group">
          <label for="forgotEmail">Email Address</label>
          <div class="input-field">
            <span class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input type="email" id="forgotEmail" placeholder="you@example.com" required>
          </div>
          <span class="error-msg" id="forgotEmailError"></span>
        </div>

        <button type="submit" class="submit-btn" id="forgotSubmitBtn">
          <span class="btn-text">Send Reset Link</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
